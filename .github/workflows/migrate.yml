# Checks that a pull request which changes the grammar, the keyword table or
# the prelude, or deletes an ABI baseline, adds a migration rule or says
# `no-migration: <why>` in its description (tools/migrate/check.py, ADR 0073
# section 5). It reruns when the description is edited. Plain Python on a
# checkout: seconds, no Bazel.
name: migrate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: migrate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/migrate/check.py --self-test
      # The description goes through the environment, never into the
      # script's text, since anyone who opens a pull request writes it.
      - run: python3 tools/migrate/check.py --base="origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
