# Builds and tests everything on both targets Pia compiles for (ADR 0049):
# Apple silicon (macOS arm64), the product target, and Linux x86_64. A cold
# run builds LLVM/MLIR and Z3 from source, which can take two to three
# hours on a hosted runner. The Bazel disk cache below makes later runs
# incremental.
#
# main only changes through the merge queue. Each queue group runs the Linux
# job on the merged result, and the `merge queue gate` job is the check the
# queue requires. The macOS job runs on pull requests and on main, but not in
# the queue, because macOS runners wait a long time for a machine.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# A new push to a pull request makes its older run worthless, so that run is
# cancelled. Runs on main are not: each one checks a commit that landed and
# saves the cache that later runs start from. Queue groups each have their
# own ref, so they never cancel one another.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: bazel test (macOS arm64)
    if: github.event_name != 'merge_group'
    runs-on: macos-15
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      # One cache entry per set of dependencies. Pia's own code is cheap to
      # rebuild; LLVM, MLIR and Z3 are what the cache is for.
      - name: Name the cache
        id: key
        run: echo "key=bazel-disk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the Bazel disk cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pia-bazel-disk
          key: ${{ steps.key.outputs.key }}
          restore-keys: |
            ${{ steps.key.outputs.key }}-partial-
            bazel-disk-${{ runner.os }}-${{ runner.arch }}-

      # BuildBuddy remote cache and results UI (.bazelrc, config buildbuddy).
      # Pull requests from forks get no secrets, so they build without it.
      - name: Use the BuildBuddy remote cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            {
              echo "common --config=buildbuddy"
              echo "common --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY"
              echo "common --build_metadata=ROLE=CI"
              echo "common --build_metadata=REPO_URL=${{ github.server_url }}/${{ github.repository }}"
            } > user.bazelrc
            echo "BuildBuddy remote cache on."
          else
            echo "No BUILDBUDDY_API_KEY secret; building without the remote cache."
          fi

      # The step timeouts leave the job time to save what was built.
      - name: Build
        timeout-minutes: 300
        run: bazel build --config=ci --keep_going //...

      - name: Test
        id: test
        timeout-minutes: 30
        run: bazel test --config=ci --keep_going //...

      # Build time is a benchmark (ADR 0032). The solver cost is deterministic
      # and gated against tools/bench/baseline.json; wall times are reported
      # in the job summary and kept as an artifact.
      - name: Proof build-time benchmark
        id: bench
        if: steps.test.outcome == 'success'
        # The corpus proves twice (1 thread, then several), about 35 min on
        # macos-15 since the set algorithms (#288). The gate is the solver
        # cost, not the wall time, so the limit only stops a hang.
        timeout-minutes: 75
        run: >-
          python3 tools/bench/proof_bench.py
          --piac bazel-bin/tools/piac/piac
          --host github-macos-15
          --out bench.json
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the benchmark
        if: always() && steps.bench.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: proof-bench
          path: bench.json
          if-no-files-found: ignore

      - name: Save the Bazel disk cache
        if: steps.test.outcome == 'success' && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/pia-bazel-disk
          key: ${{ steps.key.outputs.key }}

      # A run that fails or runs out of time still keeps what it built, under
      # its own key, so the next run starts from there.
      - name: Save a partial Bazel disk cache
        if: always() && steps.test.outcome != 'success' && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/pia-bazel-disk
          key: ${{ steps.key.outputs.key }}-partial-${{ github.run_id }}

      - name: Collect test logs
        if: failure()
        run: rsync -aL --include='*/' --include='test.log' --exclude='*' --prune-empty-dirs bazel-testlogs/ testlogs/ || true

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: testlogs/
          if-no-files-found: ignore

  # The same build and tests on Linux x86_64, where piac compiles to ELF for
  # x86-64-v3. Proofs are target-independent, so this job also proves every
  # Pia file, and its proof benchmark has its own baseline.
  linux:
    name: bazel test (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      # clang, as on macOS, so both jobs build Z3 with the same compiler
      # family.
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4

      # A hosted runner starts with about 14 GB free, and LLVM's build
      # needs more. These preinstalled SDKs are never used here. With the
      # Android SDK gone, ANDROID_HOME must go too: Bazel's Android rules
      # fail every target when it names a directory with no SDK in it.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Name the cache
        id: key
        run: echo "key=bazel-disk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the Bazel disk cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pia-bazel-disk
          key: ${{ steps.key.outputs.key }}
          restore-keys: |
            ${{ steps.key.outputs.key }}-partial-
            bazel-disk-${{ runner.os }}-${{ runner.arch }}-

      # BuildBuddy remote cache and results UI (.bazelrc, config buildbuddy).
      # Pull requests from forks get no secrets, so they build without it.
      - name: Use the BuildBuddy remote cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            {
              echo "common --config=buildbuddy"
              echo "common --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY"
              echo "common --build_metadata=ROLE=CI"
              echo "common --build_metadata=REPO_URL=${{ github.server_url }}/${{ github.repository }}"
            } > user.bazelrc
            echo "BuildBuddy remote cache on."
          else
            echo "No BUILDBUDDY_API_KEY secret; building without the remote cache."
          fi

      - name: Build
        timeout-minutes: 300
        run: env -u ANDROID_HOME -u ANDROID_SDK_ROOT -u ANDROID_NDK_HOME bazel build --config=ci --keep_going //...

      - name: Test
        id: test
        timeout-minutes: 30
        run: env -u ANDROID_HOME -u ANDROID_SDK_ROOT -u ANDROID_NDK_HOME bazel test --config=ci --keep_going //...

      # The rlimit cost of a query is the same on Linux as on the iMac: the
      # first Linux run matched several files exactly, and no file cost more
      # than 1.5% above the baseline, so this job gates on the same one. Wall times are not gated, since the
      # baseline was recorded on another host.
      - name: Proof build-time benchmark
        id: bench
        if: steps.test.outcome == 'success'
        # The corpus proves twice (1 thread, then several), about 35 min on
        # macos-15 since the set algorithms (#288). The gate is the solver
        # cost, not the wall time, so the limit only stops a hang.
        timeout-minutes: 75
        run: >-
          python3 tools/bench/proof_bench.py
          --piac bazel-bin/tools/piac/piac
          --host github-ubuntu-24.04
          --out bench.json
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the benchmark
        if: always() && steps.bench.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: proof-bench-linux
          path: bench.json
          if-no-files-found: ignore

      # A queue group's ref is deleted once the group is done, and nothing
      # can restore a cache saved under it, so the queue does not save one.
      - name: Save the Bazel disk cache
        if: github.event_name != 'merge_group' && steps.test.outcome == 'success' && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/pia-bazel-disk
          key: ${{ steps.key.outputs.key }}

      - name: Save a partial Bazel disk cache
        if: always() && github.event_name != 'merge_group' && steps.test.outcome != 'success' && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/pia-bazel-disk
          key: ${{ steps.key.outputs.key }}-partial-${{ github.run_id }}

      - name: Collect test logs
        if: failure()
        run: rsync -aL --include='*/' --include='test.log' --exclude='*' --prune-empty-dirs bazel-testlogs/ testlogs/ || true

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-linux
          path: testlogs/
          if-no-files-found: ignore

  # The one check the merge queue requires. In a queue group it passes only
  # if the Linux job passed on the merged result. On a pull request it is
  # skipped, which counts as passing, so a pull request can join the queue
  # without first waiting for its own Linux run; that run still reports on
  # the pull request. A skipped `needs` would also count as passing, hence
  # always() and the explicit result check.
  gate:
    name: merge queue gate
    if: always() && github.event_name == 'merge_group'
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the Linux job
        run: |
          echo "bazel test (Linux x86_64): ${{ needs.linux.result }}"
          test "${{ needs.linux.result }}" = success
