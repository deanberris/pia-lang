# Builds and tests everything on both targets Pia compiles for (ADR 0049):
# Apple silicon (macOS arm64), the product target, and Linux x86_64. A cold
# run builds LLVM/MLIR and Z3 from source, which can take two to three
# hours on a hosted runner. The Bazel disk cache below makes later runs
# incremental.
#
# main only changes through the merge queue. Each queue group runs the Linux
# job on the merged result, and the `merge queue gate` job is the check the
# queue requires. The macOS job runs on pull requests and on main, but not in
# the queue, because macOS runners wait a long time for a machine.
#
# The proof benchmark (ADR 0032) runs only when the `changes` job finds a
# change that can move a gated cost (tools/bench/needs_bench.py), and every
# night on main whatever changed. Running the workflow by hand runs it too.
# It gates on Linux, in the `bench` job's three shards, with one parallel
# pass on pull requests and pushes (about 10 minutes a shard), and both
# passes and their determinism check at night. At night `bench-macos` also
# proves the corpus in three macOS shards, to check that arm64 costs the
# same; pull requests do not, since macOS runners are slower and scarcer.
#
# Runs on main (and manual runs) package and upload stripped `pia` and `piac`
# binaries (`pia-macos-arm64` and `pia-linux-x86_64`, kept 14 days). When both
# platforms pass on `main`, `publish-latest` also updates the moving `latest`
# GitHub prerelease (`pia-linux-x86_64.tar.gz`, `pia-macos-arm64.tar.gz`, and
# `SHA256SUMS.txt`) so sessions and users can fetch them with
# `gh release download latest -R deanberris/pia-lang --pattern 'pia-linux-x86_64.tar.gz'`
# (or `pia-macos-arm64.tar.gz`, or the GitHub Releases URL) without building
# LLVM, MLIR and Z3.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    # 16:00 UTC is 2 or 3 in the morning in Sydney.
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request makes its older run worthless, so that run is
# cancelled. Runs on main are not: each one checks a commit that landed and
# saves the cache that later runs start from. Queue groups each have their
# own ref, so they never cancel one another. The event is in the group too:
# GitHub keeps one waiting run per group, so a nightly or manual run on main
# that shared a group with pushes was replaced by the next merge and never ran.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Says whether this run needs the proof benchmark. When it cannot tell, it
  # says yes: the benchmark is skipped only when nothing it gates changed.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bench: ${{ steps.bench.outputs.bench }}
      idle: ${{ steps.bench.outputs.idle }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Does the proof benchmark need to run?
        id: bench
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          case "$EVENT" in
            # A pull request checks out its merge into the base branch, so
            # the merge's first parent is the base it is compared with.
            pull_request) base=$(git rev-parse HEAD^1) ;;
            push) base="$PUSH_BEFORE" ;;
            merge_group) base="$QUEUE_BASE" ;;
            *) base="" ;;  # nightly or by hand: everything
          esac
          bench=true
          idle=false
          # A night with no new commits on main has nothing new to check,
          # so the nightly run builds nothing.
          if [ "$EVENT" = schedule ] && [ -z "$(git log --since='25 hours ago' --format=%H -1)" ]; then
            bench=false
            idle=true
          elif [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            bench=$(git diff --name-only "$base" HEAD | python3 tools/bench/needs_bench.py) || bench=true
          fi
          echo "bench=$bench" >> "$GITHUB_OUTPUT"
          echo "idle=$idle" >> "$GITHUB_OUTPUT"
          echo "Proof benchmark: $bench ($EVENT)" | tee -a "$GITHUB_STEP_SUMMARY"

  test:
    name: bazel test (macOS arm64)
    if: github.event_name != 'merge_group' && needs.changes.outputs.idle != 'true'
    needs: changes
    runs-on: macos-15
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        # The whole history: piac's version counts the commits (ADR 0073).
        with:
          fetch-depth: 0

      # One cache entry per set of dependencies. Pia's own code is cheap to
      # rebuild; LLVM, MLIR and Z3 are what the cache is for.
      - name: Name the cache
        id: key
        run: echo "key=bazel-disk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the Bazel disk cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pia-bazel-disk
          key: ${{ steps.key.outputs.key }}
          restore-keys: |
            ${{ steps.key.outputs.key }}-partial-
            bazel-disk-${{ runner.os }}-${{ runner.arch }}-

      # BuildBuddy remote cache and results UI (.bazelrc, config buildbuddy).
      # Pull requests from forks get no secrets, so they build without it.
      - name: Use the BuildBuddy remote cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            {
              echo "common --config=buildbuddy"
              echo "common --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY"
              echo "common --build_metadata=ROLE=CI"
              echo "common --build_metadata=REPO_URL=${{ github.server_url }}/${{ github.repository }}"
            } > user.bazelrc
            echo "BuildBuddy remote cache on."
          else
            echo "No BUILDBUDDY_API_KEY secret; building without the remote cache."
          fi

      # Xcode 26 ships the Metal compiler as a separate component, which
      # tests/gpu needs for its .metallib (ADR 0068). Without it, the
      # requires-metal targets are left out, and the summary says so.
      - name: Metal toolchain
        run: |
          if ! xcrun -sdk macosx metal --version > /dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain || true
          fi
          if xcrun -sdk macosx metal --version > /dev/null 2>&1 &&
             xcrun -sdk macosx -f metallib > /dev/null 2>&1; then
            echo "Metal toolchain: $(xcrun -sdk macosx metal --version | head -1)"
          else
            {
              echo "common --build_tag_filters=-requires-metal"
              echo "common --test_tag_filters=-requires-metal"
            } >> user.bazelrc
            echo "No Metal toolchain: requires-metal targets skipped" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # The step timeouts leave the job time to save what was built.
      - name: Build
        timeout-minutes: 300
        run: bazel build --config=ci --keep_going //...

      - name: Test
        id: test
        timeout-minutes: 30
        run: bazel test --config=ci --keep_going //...

      # Build time is a benchmark (ADR 0032). Linux gates every change (the
      # bench job below); once a night the bench-macos job proves the corpus
      # on arm64 too, in three shards, with this job's piac, to check that
      # arm64 costs what x86_64 does.
      - name: Keep piac for the benchmark
        if: >-
          steps.test.outcome == 'success' && needs.changes.outputs.bench == 'true' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          mkdir -p "${{ runner.temp }}/bench-piac"
          cp -L bazel-bin/tools/piac/piac "${{ runner.temp }}/bench-piac/piac"
          # Bazel's outputs are read-only, and strip rewrites the file; Apple
          # silicon rejects an unsigned Mach-O, so it is signed again.
          chmod 755 "${{ runner.temp }}/bench-piac/piac"
          strip -x "${{ runner.temp }}/bench-piac/piac"
          codesign --force --sign - "${{ runner.temp }}/bench-piac/piac"
          COPYFILE_DISABLE=1 tar -czf "${{ runner.temp }}/bench-piac.tar.gz" -C "${{ runner.temp }}/bench-piac" piac

      - name: Upload piac for the benchmark
        if: >-
          steps.test.outcome == 'success' && needs.changes.outputs.bench == 'true' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: bench-piac-macos
          path: ${{ runner.temp }}/bench-piac.tar.gz
          retention-days: 1
          compression-level: 0

      # Prebuilt binaries from main (and manual runs) let cloud sessions and
      # users run `pia repl` and `piac --verify` without building LLVM, MLIR
      # and Z3 from source. Packaged as a tarball so execute bits survive
      # GitHub's artifact zip; re-signed after stripping because Apple silicon
      # rejects unsigned Mach-O binaries.
      # The published piac knows its version (src/version, ADR 0073). Only
      # piac is built again: everything it links is cached.
      - name: Stamp piac
        if: steps.test.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: bazel build --config=ci --config=release //tools/piac

      - name: Package binaries
        if: steps.test.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          stage="${{ runner.temp }}/pia-macos-arm64"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp -L bazel-bin/tools/pia/pia bazel-bin/tools/piac/piac "$stage/"
          chmod 755 "$stage/pia" "$stage/piac"
          strip -x "$stage/pia" "$stage/piac"
          codesign --force --sign - "$stage/pia" "$stage/piac"
          printf 'let f (x : i32) : i32\n  ensures result = x\n= x\n' > "${{ runner.temp }}/smoke.pia"
          "$stage/piac" --version
          "$stage/piac" --version | grep -q '^piac [0-9]'
          "$stage/piac" --verify "${{ runner.temp }}/smoke.pia"
          printf 'let sum (a : u8) (b : u8) : u16 = a + b\nsum 1 2\n' | "$stage/pia" repl
          COPYFILE_DISABLE=1 tar -czf "${{ runner.temp }}/pia-macos-arm64.tar.gz" -C "$stage" pia piac
          ls -lh "$stage/pia" "$stage/piac" "${{ runner.temp }}/pia-macos-arm64.tar.gz"

      - name: Upload binaries
        if: steps.test.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: pia-macos-arm64
          path: ${{ runner.temp }}/pia-macos-arm64.tar.gz
          retention-days: 14
          compression-level: 0

      - name: Save the Bazel disk cache
        if: steps.test.outcome == 'success' && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/pia-bazel-disk
          key: ${{ steps.key.outputs.key }}

      # A run that fails or runs out of time still keeps what it built, under
      # its own key, so the next run starts from there.
      - name: Save a partial Bazel disk cache
        if: always() && steps.test.outcome != 'success' && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/pia-bazel-disk
          key: ${{ steps.key.outputs.key }}-partial-${{ github.run_id }}

      - name: Collect test logs
        if: failure()
        run: rsync -aL --include='*/' --include='test.log' --exclude='*' --prune-empty-dirs bazel-testlogs/ testlogs/ || true

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: testlogs/
          if-no-files-found: ignore

  # The same build and tests on Linux x86_64, where piac compiles to ELF for
  # x86-64-v3. Proofs are target-independent, so this job also proves every
  # Pia file, and its proof benchmark has its own baseline.
  linux:
    name: bazel test (Linux x86_64)
    if: needs.changes.outputs.idle != 'true'
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      # clang, as on macOS, so both jobs build Z3 with the same compiler
      # family.
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        # The whole history: piac's version counts the commits (ADR 0073).
        with:
          fetch-depth: 0

      # A hosted runner starts with about 14 GB free, and LLVM's build
      # needs more. These preinstalled SDKs are never used here. With the
      # Android SDK gone, ANDROID_HOME must go too: Bazel's Android rules
      # fail every target when it names a directory with no SDK in it.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Name the cache
        id: key
        run: echo "key=bazel-disk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the Bazel disk cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pia-bazel-disk
          key: ${{ steps.key.outputs.key }}
          restore-keys: |
            ${{ steps.key.outputs.key }}-partial-
            bazel-disk-${{ runner.os }}-${{ runner.arch }}-

      # BuildBuddy remote execution (.bazelrc, config rbe): actions build and
      # run on BuildBuddy's Linux executors, with its remote cache and
      # results UI. Pull requests from forks get no secrets, so they build
      # on the runner instead.
      - name: Use BuildBuddy remote execution
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            {
              echo "common --config=rbe"
              echo "common --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY"
              echo "common --build_metadata=ROLE=CI"
              echo "common --build_metadata=REPO_URL=${{ github.server_url }}/${{ github.repository }}"
            } > user.bazelrc
            echo "BuildBuddy remote execution on."
          else
            echo "No BUILDBUDDY_API_KEY secret; building on the runner."
          fi

      - name: Build
        timeout-minutes: 300
        run: env -u ANDROID_HOME -u ANDROID_SDK_ROOT -u ANDROID_NDK_HOME bazel build --config=ci --keep_going //...

      - name: Test
        id: test
        timeout-minutes: 30
        run: env -u ANDROID_HOME -u ANDROID_SDK_ROOT -u ANDROID_NDK_HOME bazel test --config=ci --keep_going //...

      # The bench job's shards prove the corpus with this piac, on runners
      # of their own, so this job is not held for the benchmark.
      - name: Keep piac for the benchmark
        if: steps.test.outcome == 'success' && needs.changes.outputs.bench == 'true'
        run: |
          mkdir -p "${{ runner.temp }}/bench-piac"
          cp -L bazel-bin/tools/piac/piac "${{ runner.temp }}/bench-piac/piac"
          # Bazel's outputs are read-only, and strip rewrites the file.
          chmod 755 "${{ runner.temp }}/bench-piac/piac"
          strip "${{ runner.temp }}/bench-piac/piac"
          tar -czf "${{ runner.temp }}/bench-piac.tar.gz" -C "${{ runner.temp }}/bench-piac" piac

      - name: Upload piac for the benchmark
        if: steps.test.outcome == 'success' && needs.changes.outputs.bench == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bench-piac-linux
          path: ${{ runner.temp }}/bench-piac.tar.gz
          retention-days: 1
          compression-level: 0

      # Prebuilt binaries from main (and manual runs) let cloud sessions and
      # users run `pia repl` and `piac --verify` without building LLVM, MLIR
      # and Z3 from source. Linux builds with --fission=dbg,fastbuild, so debug
      # info already lives in .dwo files that are not shipped; stripping drops
      # the remaining symbol tables. Packaged as a tarball so execute bits
      # survive GitHub's artifact zip.
      # The published piac knows its version (src/version, ADR 0073), and
      # on pull requests the stamp is checked, so the step that publishes
      # it on main cannot be the first to find it broken.
      - name: Stamp piac
        if: steps.test.outcome == 'success'
        run: |
          if [ "${{ github.event_name }}" = push ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            env -u ANDROID_HOME -u ANDROID_SDK_ROOT -u ANDROID_NDK_HOME bazel build --config=ci --config=release //tools/piac
          else
            env -u ANDROID_HOME -u ANDROID_SDK_ROOT -u ANDROID_NDK_HOME bazel build --config=ci --config=release //src/version:stamp_inc
          fi
          cat bazel-bin/src/version/Stamp.inc
          grep -q '^#define PIA_PROVER_VERSION "[0-9][0-9.]*+[0-9]*\.[0-9a-f]*"$' bazel-bin/src/version/Stamp.inc

      - name: Package binaries
        if: steps.test.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          stage="${{ runner.temp }}/pia-linux-x86_64"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp -L bazel-bin/tools/pia/pia bazel-bin/tools/piac/piac "$stage/"
          chmod 755 "$stage/pia" "$stage/piac"
          strip "$stage/pia" "$stage/piac"
          printf 'let f (x : i32) : i32\n  ensures result = x\n= x\n' > "${{ runner.temp }}/smoke.pia"
          "$stage/piac" --version
          "$stage/piac" --version | grep -q '^piac [0-9]'
          "$stage/piac" --verify "${{ runner.temp }}/smoke.pia"
          printf 'let sum (a : u8) (b : u8) : u16 = a + b\nsum 1 2\n' | "$stage/pia" repl
          tar -czf "${{ runner.temp }}/pia-linux-x86_64.tar.gz" -C "$stage" pia piac
          ls -lh "$stage/pia" "$stage/piac" "${{ runner.temp }}/pia-linux-x86_64.tar.gz"

      - name: Upload binaries
        if: steps.test.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: pia-linux-x86_64
          path: ${{ runner.temp }}/pia-linux-x86_64.tar.gz
          retention-days: 14
          compression-level: 0

      # A queue group's ref is deleted once the group is done, and nothing
      # can restore a cache saved under it, so the queue does not save one.
      - name: Save the Bazel disk cache
        if: github.event_name != 'merge_group' && steps.test.outcome == 'success' && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/pia-bazel-disk
          key: ${{ steps.key.outputs.key }}

      - name: Save a partial Bazel disk cache
        if: always() && github.event_name != 'merge_group' && steps.test.outcome != 'success' && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/pia-bazel-disk
          key: ${{ steps.key.outputs.key }}-partial-${{ github.run_id }}

      - name: Collect test logs
        if: failure()
        run: rsync -aL --include='*/' --include='test.log' --exclude='*' --prune-empty-dirs bazel-testlogs/ testlogs/ || true

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-linux
          path: testlogs/
          if-no-files-found: ignore

  # The proof build-time benchmark (ADR 0032), gated on Linux. The corpus
  # is split into three shards, balanced by the baseline's wall times
  # (proof_bench.py --shard), each on a runner of its own with the Linux
  # job's piac. The rlimit cost of a query is the same on Linux as on the
  # iMac and on macOS, so this gates on the one baseline; wall times are
  # reported, not gated, since the baseline was recorded on another host.
  # Pull requests and pushes prove each file once, in parallel; the nightly
  # and manual runs prove it on one thread too, and check that both agree.
  bench:
    name: proof benchmark (Linux, shard ${{ matrix.shard }}/3)
    if: needs.changes.outputs.bench == 'true' && needs.linux.result == 'success'
    needs: [changes, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - name: Download piac
        uses: actions/download-artifact@v4
        with:
          name: bench-piac-linux
          path: ${{ runner.temp }}

      - name: Unpack piac
        run: tar -xzf "${{ runner.temp }}/bench-piac.tar.gz" -C "${{ runner.temp }}"

      - name: Proof build-time benchmark
        # A shard takes about 10 minutes in one pass and 25 in two. The gate
        # is the solver cost, not the wall time, so the limit only stops a
        # hang.
        timeout-minutes: 50
        env:
          PASSES: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'both' || 'parallel' }}
        run: >-
          python3 tools/bench/proof_bench.py
          --piac "${{ runner.temp }}/piac"
          --host github-ubuntu-24.04
          --shard ${{ matrix.shard }}/3
          --passes "$PASSES"
          --out bench-${{ matrix.shard }}.json
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-bench-linux-${{ matrix.shard }}
          path: bench-${{ matrix.shard }}.json
          if-no-files-found: ignore

  # One check for branch protection to require, standing for the three
  # Linux shards: a matrix job's checks are named after its shards when it
  # runs, but get one unexpanded name when it is skipped, so neither name
  # can be required. Skipped shards (nothing a gated cost depends on
  # changed) pass; a failed or cancelled shard, or a failed Linux job when
  # the benchmark was needed, fails it.
  bench-gate:
    name: proof benchmark (Linux)
    if: always()
    needs: [changes, linux, bench]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the shards
        env:
          NEEDED: ${{ needs.changes.outputs.bench }}
          LINUX: ${{ needs.linux.result }}
          SHARDS: ${{ needs.bench.result }}
        run: |
          echo "benchmark needed: $NEEDED; Linux job: $LINUX; shards: $SHARDS"
          if [ "$NEEDED" != true ]; then exit 0; fi
          test "$SHARDS" = success

  # The nightly arm64 cost check: the corpus in three shards on macos-15,
  # as the Linux bench job splits it, in one parallel pass, against the same
  # baseline. Only at night and by hand: three macOS runners per pull request
  # would take most of the account's concurrent macOS jobs from other runs.
  bench-macos:
    name: proof benchmark (macOS, shard ${{ matrix.shard }}/3)
    if: >-
      needs.changes.outputs.bench == 'true' && needs.test.result == 'success' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [changes, test]
    runs-on: macos-15
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - name: Download piac
        uses: actions/download-artifact@v4
        with:
          name: bench-piac-macos
          path: ${{ runner.temp }}

      - name: Unpack piac
        run: tar -xzf "${{ runner.temp }}/bench-piac.tar.gz" -C "${{ runner.temp }}"

      - name: Proof build-time benchmark
        # About 12 minutes a shard on 3 cores. The gate is the solver cost,
        # not the wall time, so the limit only stops a hang.
        timeout-minutes: 60
        run: >-
          python3 tools/bench/proof_bench.py
          --piac "${{ runner.temp }}/piac"
          --host github-macos-15
          --shard ${{ matrix.shard }}/3
          --passes parallel
          --out bench-${{ matrix.shard }}.json
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-bench-macos-${{ matrix.shard }}
          path: bench-${{ matrix.shard }}.json
          if-no-files-found: ignore

  # `merge queue gate` is the one check the merge queue requires. In a queue
  # group it passes only if the Linux job passed on the merged result. A
  # skipped `needs` would count as passing, hence always() and the explicit
  # result check.
  gate:
    # Outside the queue this job is skipped, but only once the Linux job is
    # done, so it takes another name there and leaves the required check to
    # gate-pr below.
    name: ${{ github.event_name == 'merge_group' && 'merge queue gate' || 'merge queue gate (queue only)' }}
    if: always() && github.event_name == 'merge_group'
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the Linux job
        run: |
          echo "bazel test (Linux x86_64): ${{ needs.linux.result }}"
          test "${{ needs.linux.result }}" = success

  # The required check on a pull request passes at once, so a pull request
  # can join the queue without waiting for its own Linux run. That run still
  # reports on the pull request; the queue's run is the one that gates main.
  gate-pr:
    name: merge queue gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Checked in the merge queue, not here."

  # Publishes both platform tarballs and their checksums to the moving `latest`
  # GitHub prerelease once both macOS and Linux succeed on `main`. Marked
  # prerelease so it never displaces future versioned releases, and moves the
  # `latest` git tag explicitly via the Git Refs API (`gh release edit --target`
  # does not move an already-existing lightweight tag).
  publish-latest:
    name: publish latest release
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.idle != 'true' &&
      needs.test.result == 'success' &&
      needs.linux.result == 'success'
    needs: [changes, test, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: pia-linux-x86_64
          path: dist

      - name: Download macOS binaries
        uses: actions/download-artifact@v4
        with:
          name: pia-macos-arm64
          path: dist

      - name: Generate checksums
        run: |
          (cd dist && sha256sum pia-linux-x86_64.tar.gz pia-macos-arm64.tar.gz > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Update latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA:0:12}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          title="Latest build (${short_sha})"
          notes=$(cat <<EOF
          Prebuilt \`pia\` and \`piac\` binaries from \`main\` commit ${GITHUB_SHA}.

          - Workflow run: ${run_url}
          - Assets: \`pia-linux-x86_64.tar.gz\`, \`pia-macos-arm64.tar.gz\`, \`SHA256SUMS.txt\`

          Download with GitHub CLI:
          \`\`\`sh
          gh release download latest -R ${GITHUB_REPOSITORY} --pattern 'pia-linux-x86_64.tar.gz'
          # or on Apple silicon macOS:
          gh release download latest -R ${GITHUB_REPOSITORY} --pattern 'pia-macos-arm64.tar.gz'
          \`\`\`
          EOF
          )

          # Move the lightweight `latest` tag to this commit (or create it on
          # the first run). `gh release edit --target` does not move an existing
          # git tag.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/latest" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" \
              -f sha="${GITHUB_SHA}" \
              -F force=true >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/latest" \
              -f sha="${GITHUB_SHA}" >/dev/null
          fi

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest \
              --prerelease \
              --target "${GITHUB_SHA}" \
              --title "${title}" \
              --notes "${notes}"
          else
            gh release create latest \
              --prerelease \
              --verify-tag \
              --target "${GITHUB_SHA}" \
              --title "${title}" \
              --notes "${notes}"
          fi

          gh release upload latest \
            dist/pia-linux-x86_64.tar.gz \
            dist/pia-macos-arm64.tar.gz \
            dist/SHA256SUMS.txt \
            --clobber
