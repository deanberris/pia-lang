# What tools/bindings/gen.py reads from each target's headers to write
# lib/Pia/Sys/Gen/<target>.pia (ADR 0051, section 6). Only the names here
# are generated, so the file stays small enough to review and its drift
# check fails only on what Pia uses. A name in [all] must exist on both
# targets; the others are read on one target only.
#
# Add a name here, run `python3 tools/bindings/gen.py`, and check in the
# file it rewrites. The other target's file is regenerated by its CI job.

[all]
headers = [
  "errno.h",
  "fcntl.h",
  "unistd.h",
  "poll.h",
  "time.h",
  "sys/stat.h",
  "sys/mman.h",
  "sys/ioctl.h",
  "stdio.h",
  "sys/socket.h",
  "sys/un.h",
  "netinet/in.h",
  "netinet/tcp.h",
]
functions = [
  # Files and descriptors.
  "open", "close", "read", "write", "pread", "pwrite", "lseek", "fsync",
  "ftruncate", "fstat", "unlink", "mkdir", "rmdir", "rename", "fcntl",
  "ioctl", "pipe", "dup", "dup2", "isatty", "getpid", "getpagesize",
  "_exit",
  # Sockets.
  "socket", "socketpair", "bind", "listen", "accept", "connect", "send",
  "recv", "sendto", "recvfrom", "shutdown", "setsockopt", "getsockopt",
  "getsockname", "getpeername",
  # Waiting and time.
  "poll", "nanosleep", "clock_gettime",
  # Memory. mmap returns a pointer, so it is listed as skipped until
  # foreign pointers exist.
  "mmap", "munmap",
]
constants = [
  "O_RDONLY", "O_WRONLY", "O_RDWR", "O_CREAT", "O_EXCL", "O_TRUNC",
  "O_APPEND", "O_NONBLOCK", "O_CLOEXEC", "O_DIRECTORY",
  "F_GETFD", "F_SETFD", "F_GETFL", "F_SETFL", "FD_CLOEXEC",
  "SEEK_SET", "SEEK_CUR", "SEEK_END",
  "STDIN_FILENO", "STDOUT_FILENO", "STDERR_FILENO",
  "EPERM", "ENOENT", "EINTR", "EIO", "EBADF", "EAGAIN", "EWOULDBLOCK",
  "ENOMEM", "EACCES", "EEXIST", "ENOTDIR", "EISDIR", "EINVAL", "EMFILE",
  "ENOSPC", "EPIPE", "ERANGE", "EINPROGRESS", "EALREADY", "ENOTSOCK",
  "EADDRINUSE", "EADDRNOTAVAIL", "ENETUNREACH", "ECONNABORTED",
  "ECONNRESET", "ENOTCONN", "ETIMEDOUT", "ECONNREFUSED", "ECANCELED",
  "AF_UNSPEC", "AF_UNIX", "AF_INET", "AF_INET6",
  "SOCK_STREAM", "SOCK_DGRAM",
  "SOL_SOCKET", "SO_REUSEADDR", "SO_REUSEPORT", "SO_KEEPALIVE", "SO_ERROR",
  "SO_RCVBUF", "SO_SNDBUF",
  "IPPROTO_TCP", "IPPROTO_UDP", "TCP_NODELAY",
  "SHUT_RD", "SHUT_WR", "SHUT_RDWR",
  "POLLIN", "POLLOUT", "POLLERR", "POLLHUP", "POLLNVAL",
  "CLOCK_REALTIME", "CLOCK_MONOTONIC",
  "PROT_NONE", "PROT_READ", "PROT_WRITE", "MAP_SHARED", "MAP_PRIVATE",
  "MAP_ANON",
]
structs = [
  "sockaddr", "sockaddr_in", "sockaddr_in6", "sockaddr_un",
  "sockaddr_storage", "in_addr", "timespec", "pollfd", "stat",
]

[x86_64_linux]
headers = [
  "sys/epoll.h",
  "sys/eventfd.h",
  "sys/syscall.h",
  "linux/io_uring.h",
]
functions = [
  "accept4", "pipe2", "epoll_create1", "epoll_ctl", "epoll_wait",
  "eventfd", "syscall",
]
constants = [
  "SOCK_NONBLOCK", "SOCK_CLOEXEC", "MSG_NOSIGNAL",
  "EPOLLIN", "EPOLLOUT", "EPOLLERR", "EPOLLHUP", "EPOLLRDHUP", "EPOLLET",
  "EPOLLONESHOT", "EPOLL_CTL_ADD", "EPOLL_CTL_MOD", "EPOLL_CTL_DEL",
  "EPOLL_CLOEXEC", "EFD_NONBLOCK", "EFD_CLOEXEC", "MAP_POPULATE",
  "SYS_io_uring_setup", "SYS_io_uring_enter", "SYS_io_uring_register",
  "IORING_OFF_SQ_RING", "IORING_OFF_CQ_RING", "IORING_OFF_SQES",
  "IORING_ENTER_GETEVENTS", "IORING_FEAT_SINGLE_MMAP", "IORING_FEAT_NODROP",
  "IORING_OP_NOP", "IORING_OP_READ", "IORING_OP_WRITE", "IORING_OP_ACCEPT",
  "IORING_OP_CONNECT", "IORING_OP_SEND", "IORING_OP_RECV",
  "IORING_OP_CLOSE", "IORING_OP_TIMEOUT", "IORING_OP_ASYNC_CANCEL",
]
structs = [
  "epoll_event", "io_uring_params", "io_sqring_offsets",
  "io_cqring_offsets", "io_uring_sqe", "io_uring_cqe",
]

[arm64_macos]
headers = [
  "sys/event.h",
]
functions = [
  "kqueue", "kevent",
]
constants = [
  "SO_NOSIGPIPE", "F_NOCACHE",
  "EVFILT_READ", "EVFILT_WRITE", "EVFILT_TIMER", "EVFILT_USER",
  "EV_ADD", "EV_DELETE", "EV_ENABLE", "EV_DISABLE", "EV_ONESHOT",
  "EV_CLEAR", "EV_EOF", "EV_ERROR", "NOTE_TRIGGER",
]
structs = [
  "kevent",
]

# Interface rows whose names are not the C symbol they declare: one C
# variadic function at another arity.
[aliases]
open_mode = "open"
