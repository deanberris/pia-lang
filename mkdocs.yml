# The documentation site, published to GitHub Pages by
# .github/workflows/docs.yml at https://pia-lang.dev/ (the custom domain is
# set in the repository's Settings > Pages). Build it locally with:
#   pip install -r tools/docs/requirements.txt
#   mkdocs serve
site_name: Pia
site_description: A programming language whose compiler proves your code correct before it runs.
site_url: https://pia-lang.dev/
repo_url: https://github.com/deanberris/pia-lang
repo_name: deanberris/pia-lang
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

exclude_docs: |
  BUILD.bazel

hooks:
  - tools/docs/hooks.py

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - "Demo: edge detection": demo.md
  - "Demo: stream delineation": streams.pia.md
